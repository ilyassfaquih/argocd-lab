apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: spring-app
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb   # "postgres" = nom du Service ClusterIP
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
