apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: postgres
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce          
  persistentVolumeReclaimPolicy: Retain   
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/postgres    
