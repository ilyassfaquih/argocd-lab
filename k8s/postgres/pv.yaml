apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    app: postgres
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce          # un seul nœud peut monter ce volume en lecture/écriture
  persistentVolumeReclaimPolicy: Retain   # ne pas effacer les données si le PVC est supprimé
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/postgres  # dossier sur le nœud K8s (parfait pour minikube/kind)
