apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-app-ingress
  namespace: spring-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx 
  rules:
    - host: spring-app.local  
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend    
                port:
                  number: 80
